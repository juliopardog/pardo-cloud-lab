services:
  web:
    image: nginx@sha256:a3554c0d0b48177b1413c26e01f695334428020d9df01243fbae3e11cfd17417
    container_name: pardo-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
      - "10.0.0.62:8080:80"
    volumes:
      - /srv/pardo-cloud-lab:/srv/pardo-cloud-lab:ro
      - /etc/pardo-cloud-lab/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
