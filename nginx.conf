server {
 listen 80;
 server_name _;
 server_tokens off;
 root /srv/pardo-cloud-lab/releases/current;
 index index.html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header X-Frame-Options DENY always;
 add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
 location /telemetry/ {
   alias /srv/pardo-cloud-lab/website/telemetry/;
   add_header Cache-Control "no-store" always;
   add_header X-Content-Type-Options nosniff always;
   add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
   autoindex off;
 }
 location = /release.json { add_header Cache-Control "no-store" always; }
 location / { try_files $uri $uri/ =404; }
 location ~ /\. { deny all; }
}
